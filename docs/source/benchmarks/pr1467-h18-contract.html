<style>
#h18-contract {font-family:var(--font-sans);color:var(--foreground)}

#h18-contract .line {display:grid;grid-template-columns:110px 1fr 80px;gap:8px;align-items:center;margin:14px 0}
#h18-contract .track {height:18px;background:var(--secondary)}
